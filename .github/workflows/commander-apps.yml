name: Build Commander Table apps

on:
  push:
    branches: [main, commander-table]
    paths:
      - 'commander/**'
      - 'commander-native/**'
      - '.github/workflows/commander-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commander-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commander-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm ci
      - name: Copy web app into the native shell
        run: rm -rf www && cp -r ../commander www && npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CommanderTable-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CommanderTable-android
          path: CommanderTable-android.apk

  ios:
    name: iOS / iPadOS (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: commander-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode on the runner
        run: |
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install Capacitor
        run: npm ci
      - name: Copy web app into the native shell
        run: rm -rf www && cp -r ../commander www && npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/CommanderTable-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CommanderTable-iOS-unsigned
          path: CommanderTable-iOS-unsigned.ipa

  release:
    name: Publish download links
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the "commander-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete commander-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create commander-latest dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Commander Table (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Android: download CommanderTable-android.apk on your phone or tablet and open it (allow installs from your browser). iPad/iPhone: the easiest install is the web app at https://akckmk.github.io/mtg-toolkit/commander/ (Share > Add to Home Screen). The unsigned .ipa is only for sideloading with your own Apple ID (Sideloadly or AltStore)."
